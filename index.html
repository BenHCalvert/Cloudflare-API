<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ben's Linktree</title>
    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="assets/background-color-flow.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="col-xs-12">
            <div class="text-center" style="padding-top: 30px; padding-bottom: 30px;">
                <img class="backdrop linktree" alt="Profile photo">
                <h2>Ben's Linktree</h2>
            </div>
            <div class="text-center">
                <div style="padding-bottom: 30px;">
                    <button type="button" id="load-btn" class="btn btn-outline-light btn-lg shake">Click Here to Load the Linktree</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="col-xs-12">
            <div id="links-container" class="text-center"></div>
        </div>
    </div>

    <div class="container" id="movie-section" style="display: none;">
        <div class="col-xs-12 text-center" style="padding-top: 20px; padding-bottom: 40px;">
            <h4>Now Watching</h4>
            <table class="table table-dark table-bordered">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Year</th>
                        <th>Actors</th>
                    </tr>
                </thead>
                <tbody id="movie-data"></tbody>
            </table>
            <div id="movie-error" class="text-warning" style="display: none;"></div>
        </div>
    </div>

    <div class="text-center" style="padding-bottom: 30px;">
        <div class="footer-text">
            <span>Take Home Assignment for Cloudflare by <a href="mailto:benhcalvert@gmail.com">Ben Calvert</a></span>
        </div>
    </div>

    <script type="module" src="./assets/script.js"></script>
</body>

</html>
